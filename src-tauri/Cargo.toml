[package]
name = "usdbee"
version = "1.2.0"
description = "Lightweight USD viewer built with Tauri, and Three.js"
authors = ["ThomasByr"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "usdbee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }
toml = "0.8"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tokio = { version = "1.50.0", features = ["time"] }
openusd = "=0.8.0"
openusd-schemas = { version = "=0.8.0", features = ["geom", "shade", "skel", "lux"] }
zip = "8.2.0"
walkdir = "2.5.0"
pathdiff = "0.2.3"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
ureq = "2.9.1"
dirs = "5.0.1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
# Only the app_info test reads Cargo.lock; already built for the build script.
toml = "0.8"
# The "test" feature unlocks tauri::test (mock runtime) for the command
# orchestration tests; it changes nothing in the shipped binary.
tauri = { version = "2", features = ["test"] }

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.dev.package."*"]
opt-level = 1 # Basic optimizations, still shares monomorphized generic code across crates.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `2` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
