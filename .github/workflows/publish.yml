name: "publish"

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-24.04" # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ""
          - platform: "ubuntu-24.04-arm" # Only available in public repos.
            args: ""
          - platform: "windows-latest"
            args: ""
            plain: true

    runs-on: ${{ matrix.platform }}
    if: github.repository == 'ThomasByr/usdbee'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install frontend dependencies
        run: npm install

      # cargo test runs only on the ubuntu jobs: linux is the fastest runner and running it on every OS would slow the matrix without extra coverage.
      - name: run Rust tests
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: run frontend tests
        run: npm test

      - name: type check frontend
        run: npm run check

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
        shell: bash

      # for cross-platform build compat, use perl
      - name: Update the Tauri App version with tag version
        run: |
          perl -pi -e 's/^version = ".*"/version = "${{ env.VERSION }}"/' src-tauri/Cargo.toml

      - name: install git-cliff
        run: cargo install git-cliff --locked || true

      - name: generate changelog
        id: changelog
        run: |
          echo 'changelog<<EOF' >> $GITHUB_OUTPUT
          git-cliff --latest --strip all --use-branch-tags >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: v${{ env.VERSION }}
          releaseBody: "${{ steps.changelog.outputs.changelog }}"
          releaseDraft: false
          prerelease: false
          # Both an .msi and an NSIS .exe are bundled; the updater must point at
          # the NSIS one, which is what an installed usdbee knows how to run.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
          releaseAssetNamePattern: "[mainBinaryName]-[version]-[platform]-[arch][setup][ext]"
          uploadPlainBinary: ${{ matrix.plain == true }}

  # latest.json is written by five jobs at once; a missing entry is either a
  # lost update or a signing secret the action only warned about.
  verify-release:
    needs: publish-tauri
    runs-on: ubuntu-24.04
    if: github.repository == 'ThomasByr/usdbee'
    permissions:
      contents: read
    steps:
      # Every bundle tauri signs gets its own platform key, so latest.json is the
      # cheapest full inventory. The trailing colon keeps "linux-x86_64" from
      # matching "linux-x86_64-deb".
      - name: latest.json lists every bundle
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          for attempt in 1 2 3; do
            curl -fsSL "$base/latest.json" -o latest.json && break
            sleep 10
          done
          test -s latest.json || { echo "cannot fetch latest.json"; exit 1; }
          missing=0
          for key in \
            darwin-aarch64 darwin-aarch64-app darwin-x86_64 darwin-x86_64-app \
            linux-aarch64 linux-aarch64-appimage linux-aarch64-deb linux-aarch64-rpm \
            linux-x86_64 linux-x86_64-appimage linux-x86_64-deb linux-x86_64-rpm \
            windows-x86_64 windows-x86_64-nsis windows-x86_64-msi; do
            grep -q "\"$key\":" latest.json || { echo "missing $key"; missing=1; }
          done
          exit $missing

      # The dmg and the portable exe carry no updater signature, so latest.json
      # never lists them and they need their own check.
      - name: dmg and portable exe uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --json assets -q '.assets[].name' > assets.txt
          dmg=$(grep -c 'darwin-.*\.dmg$' assets.txt || true)
          test "$dmg" = 2 || { echo "expected 2 dmg, got $dmg"; exit 1; }
          portable=$(grep 'windows-.*\.exe$' assets.txt | grep -vc 'setup\.exe$' || true)
          test "$portable" = 1 || { echo "expected 1 portable exe, got $portable"; exit 1; }
